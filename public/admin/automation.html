<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RK Cashew — Order & Invoice Automation</title><style>body{font:15px system-ui;margin:0;background:#f5f6f8;color:#182033}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dde2ea;border-radius:16px;padding:18px;margin:12px 0}h1{margin:0 0 8px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,button{border:1px solid #cfd6e2;background:#fff;border-radius:10px;padding:11px 14px;font-weight:700}.active{background:#182033;color:#fff}label{font-weight:700;font-size:12px;display:block;margin:8px 0 4px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd3df;border-radius:9px;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.warn{background:#fff4cf;border:1px solid #e8c55a;padding:10px;border-radius:10px}.bad{background:#ffe5e5;border-color:#e28b8b}.ok{background:#e8f8ed;border-color:#91c8a0}.line{display:grid;grid-template-columns:2fr .8fr 1fr 1fr auto;gap:8px;align-items:end;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.line{grid-template-columns:1fr 1fr}.line .wide{grid-column:1/-1}}</style></head><body><div class="wrap"><div class="card"><h1>RK Cashew — Order Automation</h1><div>Screenshot OCR and Manual Entry use the same verification and invoice engine.</div></div><div class="tabs"><button class="tab active" data-tab="ocr">📷 Screenshot OCR</button><button class="tab" data-tab="manual">✍️ Manual Entry</button><button class="tab" data-tab="profiles">🏢 Seller Profiles</button><button class="tab" data-tab="history">🧾 Invoice History</button></div><section id="ocr" class="card"><h2>Screenshot → OCR</h2><input id="img" type="file" accept="image/jpeg,image/png,image/webp"><div id="ocrmsg"></div><div class="actions"><button id="run">Extract Order</button></div></section><section id="manual" class="card" style="display:none"><h2>Manual Order</h2><div id="form"></div></section><section id="profiles" class="card" style="display:none"><h2>Seller Profiles</h2><div id="profilesList"></div><hr><h3>Add / Update Seller</h3><div class="grid"><div><label>ID</label><input id="pid"></div><div><label>Legal name</label><input id="plegal"></div><div><label>Trade name</label><input id="ptrade"></div><div><label>GSTIN</label><input id="pgst"></div><div class="full"><label>Registered address</label><textarea id="paddr"></textarea></div><div><label>State</label><input id="pstate"></div><div><label>State code</label><input id="pcode"></div><div><label>FSSAI</label><input id="pfssai"></div><div><label>Bank / UPI</label><input id="pbank"></div><div><label>UPI</label><input id="pupi"></div><div><label>Invoice prefix</label><input id="pprefix" value="RK"></div></div><div class="actions"><button onclick="saveProfile()">Save Seller Profile</button></div></section><section id="history" class="card" style="display:none"><h2>Invoice History</h2><div id="historyList">Loading…</div></section></div><script>
let profiles=[];let draft={source:'manual',lines:[{name:'',hsn:'',qty:1,unit:'kg',rate:0,discount:0}]};
const $=id=>document.getElementById(id);async function api(u,o){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){location.href='/admin/';throw Error('Login required')}if(!r.ok)throw Error(d.error||'Request failed');return d}
function tabs(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('section').forEach(x=>x.style.display=x.id===b.dataset.tab?'block':'none');if(b.dataset.tab==='profiles')loadProfiles();if(b.dataset.tab==='history')loadHistory();if(b.dataset.tab==='manual')renderForm()})}tabs();
async function loadProfiles(){const d=await api('/api/automation/profiles');profiles=d.profiles||[];$('profilesList').innerHTML=profiles.map(p=>`<div class="card"><b>${p.tradeName||p.legalName}</b><br>${p.legalName}<br>GSTIN: ${p.gstin||'—'}<br>${p.address}<br><button onclick="editProfile('${p.id}')">Edit</button> <button onclick="delProfile('${p.id}')">Delete</button></div>`).join('')||'<p>No seller profiles yet.</p>'}
window.editProfile=id=>{const p=profiles.find(x=>x.id===id);if(!p)return;['id','legalName','tradeName','gstin','address','state','stateCode','fssai','bank','upi','invoicePrefix'].forEach(k=>{const el=$('p'+({id:'id',legalName:'legal',tradeName:'trade',gstin:'gst',address:'addr',state:'state',stateCode:'code',fssai:'fssai',bank:'bank',upi:'upi',invoicePrefix:'prefix'}[k]));if(el)el.value=p[k]||''})};window.delProfile=async id=>{if(confirm('Delete seller profile?')){await api('/api/automation/profiles?id='+encodeURIComponent(id),{method:'DELETE'});loadProfiles()}};
window.saveProfile=async()=>{const p={id:$('pid').value,legalName:$('plegal').value,tradeName:$('ptrade').value,gstin:$('pgst').value,address:$('paddr').value,state:$('pstate').value,stateCode:$('pcode').value,fssai:$('pfssai').value,bank:$('pbank').value,upi:$('pupi').value,invoicePrefix:$('pprefix').value};try{await api('/api/automation/profiles',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({profile:p})});alert('Saved');loadProfiles()}catch(e){alert(e.message)}};
function renderForm(data=draft){draft={...draft,...data};const opts=profiles.map(p=>`<option value="${p.id}" ${draft.sellerId===p.id?'selected':''}>${p.tradeName||p.legalName}</option>`).join('');$('form').innerHTML=`<div class="grid"><div><label>Seller profile</label><select id="sellerId"><option value="">Select seller</option>${opts}</select></div><div><label>Customer name</label><input id="customerName" value="${escv(draft.customerName)}"></div><div><label>Mobile</label><input id="phone" value="${escv(draft.phone)}"></div><div><label>Email</label><input id="email" value="${escv(draft.email)}"></div><div><label>GSTIN</label><input id="gstin" value="${escv(draft.gstin)}"></div><div><label>Place of supply</label><input id="placeOfSupply" value="${escv(draft.placeOfSupply)}"></div><div class="full"><label>Billing / Shipping address</label><textarea id="address">${escv(draft.address)}</textarea></div><div><label>Payment mode</label><select id="paymentMode"><option>NEFT</option><option>UPI</option><option>Cash</option><option>Card</option><option>Other</option></select></div><div><label>Payment reference / UTR</label><input id="paymentRef" value="${escv(draft.paymentRef)}"></div><div><label>Delivery responsibility</label><select id="deliveryResponsibility"><option>RK Cashew</option><option>Buyer arranged pickup/courier</option><option>Third Party</option></select></div><div><label>Transporter / courier</label><input id="transporter" value="${escv(draft.transporter)}"></div><div><label>GST %</label><input id="gstRate" type="number" value="${draft.gstRate||5}"></div><div class="full"><label>Products</label><div id="lines"></div><button type="button" onclick="addLine()">+ Product</button></div></div><div class="actions"><button onclick="saveDraft()">Save for Verification</button><button onclick="finalize()">Confirm & Create Invoice</button></div><div id="msg"></div>`;renderLines()}
function escv(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function renderLines(){ $('lines').innerHTML=(draft.lines||[]).map((l,i)=>`<div class="line"><div class="wide"><label>Product / HSN</label><input data-i="${i}" data-k="name" value="${escv(l.name)}" placeholder="Product"></div><div><label>Qty</label><input data-i="${i}" data-k="qty" type="number" value="${l.qty||1}"></div><div><label>Rate</label><input data-i="${i}" data-k="rate" type="number" value="${l.rate||0}"></div><div><label>HSN</label><input data-i="${i}" data-k="hsn" value="${escv(l.hsn)}"></div><button onclick="draft.lines.splice(${i},1);renderLines()">×</button></div>`).join('')}
window.addLine=()=>{draft.lines.push({name:'',hsn:'',qty:1,unit:'kg',rate:0,discount:0});renderLines()};function readForm(){document.querySelectorAll('#form input,#form textarea,#form select').forEach(el=>{if(el.dataset.i!=null){draft.lines[+el.dataset.i][el.dataset.k]=el.type==='number'?Number(el.value):el.value}else if(el.id)draft[el.id]=el.type==='number'?Number(el.value):el.value});return draft}
window.saveDraft=async()=>{try{readForm();const d=await api('/api/automation/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(draft)});$('msg').innerHTML=`<div class="warn">${d.warnings.length?d.warnings.join('<br>'):'Review all fields before finalizing.'}</div>`}catch(e){$('msg').innerHTML='<div class="warn bad">'+e.message+'</div>'}};
window.finalize=async()=>{try{readForm();const d=await api('/api/automation/finalize',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(draft)});$('msg').innerHTML=`<div class="ok">Invoice ${d.invoice.invoiceNo} created. <a target="_blank" href="${d.invoiceUrl}">Open / Print PDF</a></div>`}catch(e){$('msg').innerHTML='<div class="warn bad">'+e.message+'</div>'}};
$('run').onclick=async()=>{const f=$('img').files[0];if(!f)return alert('Choose a screenshot');if(f.size>900000)return alert('Keep screenshot below 900 KB');const reader=new FileReader();reader.onload=async()=>{ $('ocrmsg').textContent='Reading screenshot…';try{const d=await api('/api/automation/ocr',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image:reader.result})});draft={...draft,...d.data,source:'ocr'};draft.sellerId=profiles.find(p=>p.gstin&&p.gstin===d.data.gstin)?.id||profiles[0]?.id||'';draft.lines=(d.data.lines||[]).map(x=>({...x,discount:x.discount||0}));document.querySelector('[data-tab="manual"]').click();$('msg').innerHTML='<div class="warn">OCR completed. Review highlighted/uncertain fields before confirming.</div>'}catch(e){$('ocrmsg').innerHTML='<div class="warn bad">'+e.message+'</div>'}};reader.readAsDataURL(f)};
async function loadHistory(){const d=await api('/api/automation/invoices');$('historyList').innerHTML=(d.invoices||[]).map(x=>`<div class="card"><b>${x.invoiceNo}</b> — ${escv(x.customerName)} — ₹${Number(x.total).toFixed(2)} — ${x.status} — <a target="_blank" href="/api/automation/invoice/${x.id}">Open</a></div>`).join('')||'No invoices yet.'}loadProfiles().then(()=>renderForm()).catch(e=>{});
</script></body></html>
