<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RK Cashew — Auditor</title><style>body{font-family:system-ui;margin:0;background:#f6f6f6;color:#222}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}button,input{padding:10px;border:1px solid #ccc;border-radius:8px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.big{font-size:24px;font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}@media(max-width:600px){.wrap{padding:10px;overflow:auto}}</style></head><body><main class="wrap"><h1>RK Cashew — Auditor & Sales</h1><div class="card"><label>Month <input id="month" type="month"></label> <button onclick="load()">Load Report</button> <button onclick="csv()">Export CSV</button></div><div id="summary" class="grid"></div><div class="card"><h2>Name-wise Sales</h2><div id="names">Loading…</div></div><div class="card"><h2>Product-wise Sales</h2><div id="products">Loading…</div></div><div class="card"><h2>Status Summary</h2><div id="status">Loading…</div></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tbl(rows,heads){return '<table><thead><tr>'+heads.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}async function load(){let m=document.getElementById('month').value;let u='/api/reports/sales'+(m?'?month='+encodeURIComponent(m):'');let r=await fetch(u);if(!r.ok){if(r.status===401||r.status===403)location.href='/admin/';throw new Error('Report unavailable')}let d=await r.json();document.getElementById('summary').innerHTML=[['Sales',d.totalSales],['Orders',d.orderCount],['Customers',d.uniqueCustomers],['Taxable',d.taxable],['GST',d.gst],['Discount',d.discount]].map(x=>'<div class="card"><div>'+esc(x[0])+'</div><div class="big">₹'+Number(x[1]||0).toLocaleString('en-IN',{maximumFractionDigits:2})+'</div></div>').join('');document.getElementById('names').innerHTML=tbl((d.nameWise||[]).map(x=>[x.name,x.orders,'₹'+Number(x.sales).toLocaleString('en-IN',{maximumFractionDigits:2})]),['Customer','Orders','Sales']);document.getElementById('products').innerHTML=tbl((d.productWise||[]).map(x=>[x.product,x.qty,'₹'+Number(x.sales).toLocaleString('en-IN',{maximumFractionDigits:2})]),['Product','Qty','Sales']);document.getElementById('status').innerHTML=tbl(Object.entries(d.statusWise||{}).map(([k,v])=>[k,v]),['Status','Orders'])}function csv(){let m=document.getElementById('month').value;location.href='/api/reports/sales.csv'+(m?'?month='+encodeURIComponent(m):'')}document.getElementById('month').value=new Date().toISOString().slice(0,7);load()</script></body></html>
